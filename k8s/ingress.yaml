---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parallelizer-ingress
  namespace: default
  labels:
    app: parallelizer
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    description: "Ingress for parallelizer API"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - parallelizer.example.com
      secretName: parallelizer-tls-cert
  rules:
    - host: parallelizer.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: parallelizer-api
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: parallelizer-api
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: parallelizer-api
                port:
                  number: 9090

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: parallelizer-tls-cert
  namespace: default
  labels:
    app: parallelizer
spec:
  secretName: parallelizer-tls-cert
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - parallelizer.example.com
    - "*.parallelizer.example.com"

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app: parallelizer
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parallelizer-internal-ingress
  namespace: default
  labels:
    app: parallelizer
  annotations:
    nginx.ingress.kubernetes.io/internal: "true"
    nginx.ingress.kubernetes.io/auth-type: "basic"
    nginx.ingress.kubernetes.io/auth-secret: "basic-auth"
    description: "Internal ingress for parallelizer metrics and admin endpoints"
spec:
  ingressClassName: nginx
  rules:
    - host: parallelizer-internal.local
      http:
        paths:
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: parallelizer-api
                port:
                  number: 9090
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: parallelizer-api
                port:
                  number: 8000

---
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth
  namespace: default
spec:
  type: Opaque
  stringData:
    auth: |
      admin:$apr1$67VQGDe9$b6sUvXnI3wdZDXHwLZHI/0

---
apiVersion: autoscaling.k8s.io/v2
kind: HorizontalPodAutoscaler
metadata:
  name: parallelizer-hpa
  namespace: default
  labels:
    app: parallelizer
  annotations:
    description: "Horizontal Pod Autoscaler for parallelizer API"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: parallelizer-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: parallelizer-pdb
  namespace: default
  labels:
    app: parallelizer
  annotations:
    description: "Pod Disruption Budget for parallelizer"
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: parallelizer
      component: api
