---
apiVersion: v1
kind: Secret
metadata:
  name: parallelizer-secrets
  namespace: default
  labels:
    app: parallelizer
  annotations:
    description: "Sensitive data for parallelizer application"
type: Opaque
stringData:
  # Redis connection string (base64 encoded in production)
  redis_url: "redis://:redis-password@redis:6379/0"

  # API authentication token
  api_token: "change-me-in-production"

  # Database credentials (if applicable)
  db_user: "parallelizer"
  db_password: "change-me-in-production"
  db_host: "postgres-db"
  db_port: "5432"
  db_name: "parallelizer"

---
apiVersion: v1
kind: Secret
metadata:
  name: parallelizer-tls
  namespace: default
  labels:
    app: parallelizer
  annotations:
    description: "TLS certificates for secure communication"
type: kubernetes.io/tls
data:
  # These are example base64-encoded certificates
  # In production, replace with real certificates
  tls.crt: 
  tls.key: 

---
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry
  namespace: default
  labels:
    app: parallelizer
  annotations:
    description: "Docker registry credentials for private images"
type: kubernetes.io/dockercfg
stringData:
  .dockercfg: |
    {
      "docker.io": {
        "auth": "dXNlcm5hbWU6cGFzc3dvcmQ="
      }
    }

