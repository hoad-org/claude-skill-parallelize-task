[project]
name = "claude-skill-parallelize-task"
version = "1.1.0"
description = "Claude skill for intelligent task parallelization, dependency analysis, and agentic workflow optimization"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Claude Code", email = "claude@anthropic.com"}
]

dependencies = [
    "pydantic>=2.5.0",
    "networkx>=3.2",
    "dataclasses-json>=0.6.0",
    "pyyaml>=6.0.0",
    "rich>=14.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.15.0",
    "black>=26.3.0",
    "mypy>=1.8.0",
    "bandit>=1.9.0",
    "pip-audit>=2.10.0",
    "httpx>=0.25.0",
]

[project.scripts]
parallelize-task = "parallelizer_skill.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --strict-markers"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "dag: DAG analysis tests",
    "optimization: optimization algorithm tests",
]

[tool.coverage.run]
source = ["src/parallelizer_skill"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 75

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
ignore_errors = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.black]
line-length = 120
target-version = ["py312"]
