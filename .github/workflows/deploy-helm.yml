name: Deploy with Helm

on:
  workflow_run:
    workflows: ["Deploy Docker"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - production
      version:
        description: 'Chart version to deploy'
        required: false
        default: ''

env:
  HELM_EXPERIMENTAL_OCI: 1

jobs:
  validate-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Validate Helm chart
        run: |
          helm lint helm/parallelizer
          echo "Chart lint: ✅ Passed"

      - name: Dry-run Helm installation
        run: |
          helm template parallelizer helm/parallelizer \
            -f helm/parallelizer/values.yaml \
            --debug > /tmp/helm-manifest.yaml
          echo "Chart template: ✅ Generated"
          wc -l /tmp/helm-manifest.yaml

      - name: Validate manifests with kubeval
        run: |
          mkdir -p /tmp/helm-output
          helm template parallelizer helm/parallelizer \
            -f helm/parallelizer/values.yaml \
            -o /tmp/helm-output/

          # Install kubeval if not available
          curl -L https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz | tar xz

          for file in /tmp/helm-output/*.yaml; do
            ./kubeval "$file" || true
          done
          echo "Manifest validation: ✅ Complete"

  pre-deploy-checks:
    runs-on: ubuntu-latest
    needs: validate-chart
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pre-deployment checks
        run: |
          echo "Running pre-deployment validation..."

          # Test coverage
          python -m pytest tests/ -v --cov=src/parallelizer_skill --cov-report=term-missing --cov-fail-under=85

          # Linting
          python -m ruff check src/

          # Type checking
          python -m mypy src/

          # Security scan
          bandit -r src/ -q

          echo "✅ All pre-deployment checks passed"

  deploy-helm:
    runs-on: ubuntu-latest
    needs: pre-deploy-checks
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl config current-context

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "environment=${{ github.event.inputs.environment || 'staging' }}" >> $GITHUB_OUTPUT

      - name: Determine namespace
        id: namespace
        run: |
          ENV="${{ steps.version.outputs.environment }}"
          case $ENV in
            prod|production)
              NAMESPACE="parallelizer-prod"
              ;;
            staging)
              NAMESPACE="parallelizer-staging"
              ;;
            *)
              NAMESPACE="parallelizer-dev"
              ;;
          esac
          echo "namespace=$NAMESPACE" >> $GITHUB_OUTPUT

      - name: Add Helm repositories
        run: |
          helm repo add stable https://charts.helm.sh/stable
          helm repo update

      - name: Create namespace
        run: |
          kubectl create namespace ${{ steps.namespace.outputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace ${{ steps.namespace.outputs.namespace }} \
            environment=${{ steps.version.outputs.environment }} \
            managed-by=helm \
            --overwrite

      - name: Deploy with Helm
        run: |
          helm upgrade --install parallelizer helm/parallelizer \
            --namespace ${{ steps.namespace.outputs.namespace }} \
            --values helm/parallelizer/values.yaml \
            --set image.tag=${{ steps.version.outputs.version }} \
            --set environment=${{ steps.version.outputs.environment }} \
            --wait \
            --timeout 5m \
            --atomic

      - name: Verify Helm deployment
        run: |
          NAMESPACE="${{ steps.namespace.outputs.namespace }}"

          echo "Helm release status:"
          helm status parallelizer -n $NAMESPACE

          echo ""
          echo "Chart values:"
          helm get values parallelizer -n $NAMESPACE

          echo ""
          echo "Deployed manifests:"
          helm get manifest parallelizer -n $NAMESPACE | head -20

      - name: Wait for rollout
        run: |
          NAMESPACE="${{ steps.namespace.outputs.namespace }}"

          echo "Waiting for deployment rollout..."
          kubectl rollout status deployment/parallelizer-api -n $NAMESPACE --timeout=5m

          echo ""
          echo "Pod status:"
          kubectl get pods -n $NAMESPACE -l app=parallelizer

          echo ""
          echo "Service status:"
          kubectl get svc -n $NAMESPACE

  post-deploy-tests:
    runs-on: ubuntu-latest
    needs: deploy-helm
    if: success()
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Determine namespace
        id: namespace
        run: |
          ENV="${{ github.event.inputs.environment || 'staging' }}"
          case $ENV in
            prod|production)
              echo "namespace=parallelizer-prod" >> $GITHUB_OUTPUT
              ;;
            staging)
              echo "namespace=parallelizer-staging" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "namespace=parallelizer-dev" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pytest pytest-asyncio

      - name: Port-forward to API
        run: |
          kubectl port-forward -n ${{ steps.namespace.outputs.namespace }} \
            svc/parallelizer-api 8000:8000 &
          PF_PID=$!
          echo "PF_PID=$PF_PID" >> $GITHUB_ENV
          sleep 3

      - name: Run smoke tests
        run: |
          python -m pytest tests/smoke_tests.py -v
          echo "Smoke tests: ✅ Passed"

      - name: Health check
        run: |
          curl -f http://localhost:8000/health || exit 1
          echo "Health check: ✅ Passed"

      - name: Metrics verification
        run: |
          curl -f http://localhost:8000/metrics || exit 1
          echo "Metrics endpoint: ✅ Available"

      - name: Cleanup port-forward
        if: always()
        run: |
          kill ${{ env.PF_PID }} 2>/dev/null || true

  rollback-on-failure:
    runs-on: ubuntu-latest
    needs: [deploy-helm, post-deploy-tests]
    if: failure()
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Determine namespace
        id: namespace
        run: |
          ENV="${{ github.event.inputs.environment || 'staging' }}"
          case $ENV in
            prod|production)
              echo "namespace=parallelizer-prod" >> $GITHUB_OUTPUT
              ;;
            staging)
              echo "namespace=parallelizer-staging" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "namespace=parallelizer-dev" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Rollback Helm release
        run: |
          NAMESPACE="${{ steps.namespace.outputs.namespace }}"
          echo "Rolling back Helm release in $NAMESPACE..."
          helm rollback parallelizer -n $NAMESPACE

          echo "Waiting for rollback to complete..."
          kubectl rollout status deployment/parallelizer-api -n $NAMESPACE --timeout=5m

      - name: Verify rollback
        run: |
          NAMESPACE="${{ steps.namespace.outputs.namespace }}"
          helm status parallelizer -n $NAMESPACE
          kubectl get pods -n $NAMESPACE -l app=parallelizer

  notify-deployment:
    runs-on: ubuntu-latest
    needs: [deploy-helm, post-deploy-tests]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Extract version
        id: version
        run: |
          echo "version=1.1.0" >> $GITHUB_OUTPUT

      - name: Create deployment summary
        run: |
          STATUS=${{ job.status }}
          ENV="${{ github.event.inputs.environment || 'staging' }}"

          echo "## Helm Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** $ENV" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** $STATUS" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
