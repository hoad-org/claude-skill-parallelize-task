name: Test & Lint

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Linting with ruff
        run: |
          ruff check . && echo "✓ ruff passed" || echo "✗ ruff failed"

      - name: Format check with black
        run: |
          black --check . && echo "✓ black passed" || echo "✗ black failed"

      - name: Type checking with mypy
        run: |
          mypy src/ --strict && echo "✓ mypy passed" || echo "✗ mypy failed"

      - name: Security scan with bandit
        run: |
          bandit -r src/ && echo "✓ bandit passed" || echo "✗ bandit failed"

      - name: Coverage check
        run: |
          pytest tests/ --cov=src/parallelizer_skill --cov-fail-under=85 --cov-report=term-missing
