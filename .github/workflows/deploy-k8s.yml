name: Deploy to Kubernetes

on:
  workflow_run:
    workflows: ["Docker Build"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - production
      tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl config current-context
          kubectl get nodes

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          TAG="${{ github.event.inputs.tag || 'v' }}$VERSION"
          ENVIRONMENT="${{ github.event.inputs.environment || 'staging' }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT

      - name: Set namespace
        id: namespace
        run: |
          ENV="${{ steps.version.outputs.environment }}"
          case $ENV in
            prod|production)
              NAMESPACE="parallelizer-prod"
              ;;
            staging)
              NAMESPACE="parallelizer-staging"
              ;;
            *)
              NAMESPACE="parallelizer-dev"
              ;;
          esac
          echo "namespace=$NAMESPACE" >> $GITHUB_OUTPUT

      - name: Create namespace
        run: |
          kubectl create namespace ${{ steps.namespace.outputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace ${{ steps.namespace.outputs.namespace }} environment=${{ steps.version.outputs.environment }} --overwrite

      - name: Deploy with kubectl
        run: |
          echo "Deploying version ${{ steps.version.outputs.version }} to ${{ steps.version.outputs.environment }}"
          ./scripts/deploy.sh ${{ steps.version.outputs.tag }} ${{ steps.namespace.outputs.namespace }}

      - name: Verify deployment
        run: |
          NAMESPACE="${{ steps.namespace.outputs.namespace }}"
          echo "Waiting for deployment to be ready..."
          kubectl rollout status deployment/parallelizer-api -n $NAMESPACE --timeout=5m
          echo ""
          echo "Deployment status:"
          kubectl get pods -n $NAMESPACE -l app=parallelizer
          kubectl get svc -n $NAMESPACE

      - name: Run smoke tests
        continue-on-error: true
        run: |
          NAMESPACE="${{ steps.namespace.outputs.namespace }}"
          echo "Running smoke tests..."
          kubectl port-forward -n $NAMESPACE svc/parallelizer-api 8000:8000 &
          PF_PID=$!
          sleep 2

          # Health check
          curl -f http://localhost:8000/health || echo "Health check failed"

          # Test metrics endpoint
          curl -f http://localhost:8000/metrics || echo "Metrics endpoint failed"

          kill $PF_PID || true

      - name: Create deployment record
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: '${{ steps.version.outputs.environment }}',
              description: 'Deployed version ${{ steps.version.outputs.version }}',
              production_environment: '${{ steps.version.outputs.environment }}' === 'production'
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: 'https://parallelizer.${{ steps.version.outputs.environment }}.example.com',
              description: 'Successfully deployed'
            });

  rollback:
    runs-on: ubuntu-latest
    if: failure()
    needs: deploy
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Determine namespace
        id: namespace
        run: |
          ENV="${{ github.event.inputs.environment || 'staging' }}"
          case $ENV in
            prod|production)
              NAMESPACE="parallelizer-prod"
              ;;
            staging)
              NAMESPACE="parallelizer-staging"
              ;;
            *)
              NAMESPACE="parallelizer-dev"
              ;;
          esac
          echo "namespace=$NAMESPACE" >> $GITHUB_OUTPUT

      - name: Rollback deployment
        run: |
          NAMESPACE="${{ steps.namespace.outputs.namespace }}"
          echo "Rolling back deployment in $NAMESPACE..."
          kubectl rollout undo deployment/parallelizer-api -n $NAMESPACE
          kubectl rollout status deployment/parallelizer-api -n $NAMESPACE --timeout=5m

      - name: Notify failure
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Deployment to ${{ github.event.inputs.environment || 'staging' }} failed and was rolled back.'
            });
