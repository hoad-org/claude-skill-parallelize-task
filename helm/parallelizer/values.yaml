# Parallelizer Helm Chart Values
# This is a YAML-formatted file.
# Declare variables to be passed into templates.

## Global settings
global:
  environment: production
  namespace: default

## Deployment configuration
replicaCount: 3

image:
  repository: parallelize-task
  pullPolicy: IfNotPresent
  tag: "1.1.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

## Service Account configuration
serviceAccount:
  create: true
  annotations: {}
  name: parallelizer

## Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

## Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

## Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

## Service configuration
service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
  annotations: {}
  metricsPort: 9090

## Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: parallelizer.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: parallelizer-tls
      hosts:
        - parallelizer.example.com

## Resource limits and requests
resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

## Autoscaling configuration
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

## Node selector
nodeSelector: {}

## Tolerations
tolerations: []

## Affinity rules
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - parallelizer
          topologyKey: kubernetes.io/hostname

## Storage configuration
persistence:
  enabled: true
  storageClass: "standard"
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /app/data

## Application configuration
application:
  logLevel: "INFO"
  environment: "production"
  dataDir: "/app/data"
  checkpointInterval: 300
  maxRetries: 3
  taskTimeout: 3600
  maxParallelTasks: 100
  cacheEnabled: true
  cacheTTL: 3600

## Monitoring configuration
monitoring:
  enabled: true
  metricsPort: 9090
  prometheusEnabled: true
  grafanaEnabled: true
  exportInterval: 15

## Redis configuration (sub-chart)
redis:
  enabled: true
  auth:
    enabled: true
    password: "redis-password"
  master:
    persistence:
      enabled: true
      size: 8Gi
  replica:
    replicaCount: 2
    persistence:
      enabled: true
      size: 8Gi

## Prometheus configuration (sub-chart)
prometheus:
  enabled: true
  prometheusSpec:
    retention: 30d
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

## Environment variables
env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PARALLELIZER_ENV: "production"
  PARALLELIZER_LOG_LEVEL: "INFO"
  PARALLELIZER_DATA_DIR: "/app/data"
  PARALLELIZER_MONITORING_ENABLED: "true"

## Secrets configuration
secrets:
  redisUrl: "redis://:redis-password@redis:6379/0"
  apiToken: "change-me-in-production"
  dbUser: "parallelizer"
  dbPassword: "change-me-in-production"

## Health check configuration
healthChecks:
  liveness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 2
  startup:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 12

## Feature flags
features:
  dagAnalysis: true
  parallelExecution: true
  performanceOptimization: true
  distributedCaching: true
  monitoringExport: true
  remotePersistence: false

## Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

## Network Policy
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

## Backup configuration
backup:
  enabled: false
  schedule: "0 2 * * *"
  retention: 30d
  storageLocation: "s3://backups"
